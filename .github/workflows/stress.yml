name: E2E Stress Nightly

on:
  schedule:
    # 09:00 UTC = 05:00 Chile (invierno) / 06:00 Chile (verano DST)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-stress
  cancel-in-progress: true

env:
  CI: 'true'
  PW_CHANNEL: 'chromium'
  PW_HEADLESS: 'true'
  JMETER_VERSION: '5.6.3'

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (requisito de JMeter)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Apache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}

      - name: Install Apache JMeter
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/jmeter.zip "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${{ env.JMETER_VERSION }}.zip"
          unzip -q /tmp/jmeter.zip -d "${{ runner.tool_cache }}"
          rm /tmp/jmeter.zip

      - name: Set JMETER_HOME
        run: |
          echo "JMETER_HOME=${{ runner.tool_cache }}/apache-jmeter-${{ env.JMETER_VERSION }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E stress suite
        run: npm run test:stress

      - name: Upload auditoría report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (trazas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30