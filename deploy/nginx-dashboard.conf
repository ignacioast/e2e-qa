# nginx — reverse proxy para exponer el dashboard E2E QA en internet/LAN.
#
# Requisito previo: el dashboard debe escuchar SOLO en localhost.
#   HOST=127.0.0.1 node scripts/dashboard.js     (o: npm run dashboard:local)
#
# Copia este archivo como:  /etc/nginx/sites-available/e2e-dashboard
# luego:  ln -s /etc/nginx/sites-available/e2e-dashboard /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name dashboard.tudominio.cl;        # Tu dominio o IP pública

    # Opcional: acceso básico con usuario/contraseña
    # apt install apache2-utils
    # htpasswd -c /etc/nginx/.htpasswd qa
    # auth_basic "E2E QA Dashboard";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- HTTPS (certbot) ---
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d dashboard.tudominio.cl